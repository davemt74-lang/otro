name: Stonefellow Native Account Consent 84B6

on:
  pull_request:
    paths:
      - 'app/services/stonefellow_native.py'
      - 'app/homeserver_apps_api.py'
      - 'app/member_api.py'
      - 'app/services/homeserver_app_prebuilt.py'
      - 'tests/stonefellow_native_84b6.py'
      - '.github/workflows/stonefellow-native-84b6.yml'
  push:
    branches: [main]
    paths:
      - 'app/services/stonefellow_native.py'
      - 'app/homeserver_apps_api.py'
      - 'app/member_api.py'
      - 'app/services/homeserver_app_prebuilt.py'
      - 'tests/stonefellow_native_84b6.py'
      - '.github/workflows/stonefellow-native-84b6.yml'

jobs:
  consent-and-member-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HomeServer test transport
        run: python -m pip install 'httpx>=0.27,<1' 'fastapi>=0.110,<1'
      - name: Compile native Stonefellow application and member routes
        run: python -m py_compile app/services/stonefellow_native.py app/services/homeserver_app_prebuilt.py app/member_api.py app/homeserver_apps_api.py tests/stonefellow_native_84b6.py
      - name: Verify logged-in Cloud consent, per-member isolation, owner admin scopes and revocation
        run: python -m tests.stonefellow_native_84b6
