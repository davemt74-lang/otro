name: HomeServer Live Meeting Read-Only Chat v18.11

on:
  workflow_dispatch:

jobs:
  read-only-chat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile read-only chat runtime
        run: python -m py_compile app/brain_api.py app/services/context_chat.py tests/live_meeting_read_only_chat_v18110.py
      - name: Phase 18.11 read-only live chat contract
        run: python tests/live_meeting_read_only_chat_v18110.py
