name: Dictation race fix temporary
on:
  push:
    branches: [agent-chat-dictation-mode]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-chat-dictation-mode
      - name: Apply focused reliability patch and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/chat-dictation.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("  let active = false;\n  let mode = null;", "  let active = false;\n  let starting = false;\n  let mode = null;"),
            ("    button.setAttribute('aria-pressed', active ? 'true' : 'false');\n    button.setAttribute('aria-label', active ? 'Stop dictation' : 'Start dictation');\n    const label = button.querySelector('.dictate-label');\n    if (!active) {\n      if (label) label.textContent = 'Dictate';\n      return;\n    }", "    const engaged = active || starting;\n    button.setAttribute('aria-pressed', engaged ? 'true' : 'false');\n    button.setAttribute('aria-label', active ? 'Stop dictation' : starting ? 'Cancel dictation setup' : 'Start dictation');\n    const label = button.querySelector('.dictate-label');\n    if (starting) {\n      if (label) label.textContent = 'Checking';\n      return;\n    }\n    if (!active) {\n      if (label) label.textContent = 'Dictate';\n      return;\n    }"),
            ("  function stopDictation(message = '') {\n    active = false;", "  function stopDictation(message = '') {\n    starting = false;\n    active = false;"),
            ("  async function startDictation() {\n    const input = byId('chatInput');\n    if (!input || !ensureControl()) return;", "  async function startDictation() {\n    if (active || starting) return;\n    const input = byId('chatInput');\n    if (!input || !ensureControl()) return;"),
            ("    captureSelection();\n    const status = await readStatus();\n    const localReady = Boolean(status?.stt?.available && localCaptureSupported());", "    captureSelection();\n    const startGeneration = ++generation;\n    starting = true;\n    setState('checking');\n    const status = await readStatus();\n    if (!starting || startGeneration !== generation) return;\n    const localReady = Boolean(status?.stt?.available && localCaptureSupported());"),
            ("    if (strictLocalEnabled() && !localReady) {\n      flash('Strict Local Dictation requires healthy Whisper STT plus local microphone capture support.', true);\n      return;\n    }\n    if (!localReady && !browserReady) {\n      flash('No speech-to-text path is available. Install Whisper STT or use a browser with speech recognition.', true);\n      return;\n    }\n\n    active = true;\n    generation += 1;", "    if (strictLocalEnabled() && !localReady) {\n      starting = false;\n      setState('idle');\n      flash('Strict Local Dictation requires healthy Whisper STT plus local microphone capture support.', true);\n      return;\n    }\n    if (!localReady && !browserReady) {\n      starting = false;\n      setState('idle');\n      flash('No speech-to-text path is available. Install Whisper STT or use a browser with speech recognition.', true);\n      return;\n    }\n\n    starting = false;\n    active = true;"),
            ("  async function toggleDictation() {\n    if (active) {", "  async function toggleDictation() {\n    if (active || starting) {")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected dictation source marker not found; refusing broad edit: ' + old[:60])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          css = Path('ui/chat-dictation.css')
          c = css.read_text(encoding='utf-8')
          reduced = '@media(prefers-reduced-motion:reduce){.chat-dictate-button,.dictate-dot{transition:none!important;animation:none!important}}'
          if reduced not in c:
              c += reduced
          css.write_text(c, encoding='utf-8')
          Path('.github/workflows/dictation-race-fix-temp.yml').unlink()
          PY
      - name: Commit focused dictation reliability fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/chat-dictation.js ui/chat-dictation.css .github/workflows/dictation-race-fix-temp.yml
          git commit -m "Harden dictation startup and reduced motion"
          git push origin HEAD:agent-chat-dictation-mode
