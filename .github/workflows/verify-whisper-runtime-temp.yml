name: Temporary Whisper Runtime Verification

on:
  push:
    branches: [local-voice-runtime]
    paths:
      - .github/workflows/verify-whisper-runtime-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Download and verify whisper.cpp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeUrl = 'https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-bin-x64.zip'
          Invoke-WebRequest -Uri $runtimeUrl -OutFile whisper-bin-x64.zip
          $runtime = Get-Item whisper-bin-x64.zip
          $runtimeHash = (Get-FileHash whisper-bin-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RUNTIME_SIZE=$($runtime.Length)"
          Write-Host "RUNTIME_SHA256=$runtimeHash"
          Expand-Archive whisper-bin-x64.zip -DestinationPath whisper-runtime
          Write-Host 'RUNTIME_FILES_BEGIN'
          Get-ChildItem whisper-runtime -Recurse -File | ForEach-Object {
            $_.FullName.Substring((Resolve-Path whisper-runtime).Path.Length + 1).Replace('\\','/')
          }
          Write-Host 'RUNTIME_FILES_END'
          Write-Host 'WHISPER_HELP_BEGIN'
          & .\whisper-runtime\Release\whisper-cli.exe -h 2>&1 | Select-String -Pattern 'output-txt|output-file|no-timestamps|no-prints|model|file'
          Write-Host 'WHISPER_HELP_END'

      - name: Download and verify tiny.en q8 model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelUrl = 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q8_0.bin'
          Invoke-WebRequest -Uri $modelUrl -OutFile ggml-tiny.en-q8_0.bin
          $model = Get-Item ggml-tiny.en-q8_0.bin
          $modelHash = (Get-FileHash ggml-tiny.en-q8_0.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "MODEL_SIZE=$($model.Length)"
          Write-Host "MODEL_SHA256=$modelHash"
