name: KB5C Food Monster Governed Auto Sync
on:
  pull_request:
    paths:
      - 'database/food_monster_sync_policy.sql'
      - 'app/database.py'
      - 'app/services/food_monster_auto_sync.py'
      - 'app/services/food_monster_sync.py'
      - 'app/services/food_monster_connector.py'
      - 'app/main.py'
      - 'ui/food-monster-connections.js'
      - 'ui/food-monster-connections.css'
      - 'tests/food_monster_kb5c.py'
      - 'tests/food_monster_kb4c_ui.mjs'
      - 'docs/FOOD_MONSTER_KB5C_AUTO_SYNC.md'
      - '.github/workflows/food-monster-kb5c.yml'
  push:
    branches: [main]
    paths:
      - 'database/food_monster_sync_policy.sql'
      - 'app/database.py'
      - 'app/services/food_monster_auto_sync.py'
      - 'app/services/food_monster_sync.py'
      - 'app/services/food_monster_connector.py'
      - 'app/main.py'
      - 'ui/food-monster-connections.js'
      - 'ui/food-monster-connections.css'
      - 'tests/food_monster_kb5c.py'
      - 'tests/food_monster_kb4c_ui.mjs'
      - 'docs/FOOD_MONSTER_KB5C_AUTO_SYNC.md'
      - '.github/workflows/food-monster-kb5c.yml'
jobs:
  governed-background-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HomeServer private-connector test dependencies
        run: python -m pip install fastapi==0.115.6 pydantic==2.10.4 httpx==0.28.1
      - name: Parse background worker, local APIs and chat controls
        run: |
          python -m py_compile app/services/food_monster_auto_sync.py app/services/food_monster_sync.py app/services/food_monster_connector.py app/main.py tests/food_monster_kb5c.py
          node --check ui/food-monster-connections.js
      - name: Certification - lease recovery, cancellation, backoff, restaurant isolation
        run: PYTHONPATH=. python tests/food_monster_kb5c.py
      - name: Certified earlier Food Monster owner boundaries
        run: |
          PYTHONPATH=. python tests/food_monster_kb5b.py
          PYTHONPATH=. python tests/food_monster_kb3.py
          PYTHONPATH=. python tests/food_monster_kb4a.py
      - name: Agent Chat UI - opt-in cadence and local-only controls
        run: node tests/food_monster_kb4c_ui.mjs
