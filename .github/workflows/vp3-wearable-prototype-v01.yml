name: VP3 wearable prototype v0.1

on:
  pull_request:
    paths:
      - "hardware/esp32/vp3_wearable_prototype/**"
      - "tests/vp3_wearable_prototype_v01.py"
      - "app/services/wearable_voice_gateway.py"
      - "app/wearable_voice_api.py"
      - "tests/vp3_wearable_voice_gateway_v01.py"
      - ".github/workflows/vp3-wearable-prototype-v01.yml"
  workflow_dispatch:

jobs:
  protocol-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OTRO runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app/services/wearable_voice_gateway.py app/wearable_voice_api.py hardware/esp32/vp3_wearable_prototype/dev_voice_preview.py hardware/esp32/vp3_wearable_prototype/simulator_bridge.py tests/vp3_wearable_prototype_v01.py tests/vp3_wearable_voice_gateway_v01.py
      - name: Run isolated hardware protocol regression
        run: python tests/vp3_wearable_prototype_v01.py
      - name: Test source-bound wearable voice gateway
        run: python tests/vp3_wearable_voice_gateway_v01.py
