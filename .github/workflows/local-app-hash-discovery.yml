name: Local App Artifact Hash Discovery

on:
  push:
    branches:
      - apps-one-click-installer
    paths:
      - '.github/workflows/local-app-hash-discovery.yml'
  workflow_dispatch:

jobs:
  hashes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and hash pinned Local App artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(
            @{ Name='piper-runtime'; Url='https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip' },
            @{ Name='piper-lessac-model'; Url='https://huggingface.co/rhasspy/piper-voices/resolve/2525f22960f62209936f0ae3cce3ffe7b2c18f1f/en/en_US/lessac/medium/en_US-lessac-medium.onnx' },
            @{ Name='piper-lessac-config'; Url='https://huggingface.co/rhasspy/piper-voices/resolve/2525f22960f62209936f0ae3cce3ffe7b2c18f1f/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json' },
            @{ Name='whisper-config'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/config.json' },
            @{ Name='whisper-generation-config'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/generation_config.json' },
            @{ Name='whisper-preprocessor'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/preprocessor_config.json' },
            @{ Name='whisper-tokenizer'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/tokenizer.json' },
            @{ Name='whisper-tokenizer-config'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/tokenizer_config.json' },
            @{ Name='whisper-added-tokens'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/added_tokens.json' },
            @{ Name='whisper-special-tokens'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/special_tokens_map.json' },
            @{ Name='whisper-vocab'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/vocab.json' },
            @{ Name='whisper-merges'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/merges.txt' },
            @{ Name='whisper-normalizer'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/normalizer.json' },
            @{ Name='whisper-encoder-q'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/onnx/encoder_model_quantized.onnx' },
            @{ Name='whisper-decoder-merged-q'; Url='https://huggingface.co/onnx-community/whisper-tiny.en/resolve/main/onnx/decoder_model_merged_quantized.onnx' }
          )
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($item in $items) {
            $path = Join-Path 'artifacts' $item.Name
            curl.exe --fail --location --retry 3 --retry-delay 2 --output $path $item.Url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $($item.Name)" }
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $size = (Get-Item $path).Length
            Write-Host "LOCAL_APP_HASH $($item.Name) sha256=$hash size=$size"
          }
