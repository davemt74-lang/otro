name: HomeServer Section 31A Brain Drawer
on:
  pull_request:
    paths:
      - 'ui/index.html'
      - 'ui/agent-brain-drawer.js'
      - 'ui/agent-brain-drawer.css'
      - 'tests/agent_brain_drawer_v451.py'
      - '.github/workflows/homeserver-brain-drawer-v451.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hs-brain-drawer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  drawer-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check ui/agent-brain-drawer.js
      - name: Drawer safety and UI contract
        run: python tests/agent_brain_drawer_v451.py
