name: Schema v20 Regression Fix

on:
  push:
    branches:
      - apps-one-click-installer
    paths:
      - '.github/workflows/schema-020-regression-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apps-one-click-installer
      - name: Update schema-version regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/migrations.py': [
                  ('migrations 11 through 19', 'migrations 11 through 20'),
                  ('list(range(1, 20))', 'list(range(1, 21))'),
              ],
              'tests/knowledge_sources.py': [
                  ('status.json()["schema_version"] == 19', 'status.json()["schema_version"] == 20'),
              ],
              'tests/context_engine.py': [
                  ('SELECT MAX(version) FROM schema_migrations").fetchone()[0] == 19', 'SELECT MAX(version) FROM schema_migrations").fetchone()[0] == 20'),
              ],
              'tests/knowledge_collections_v037.py': [
                  ('status.json()["schema_version"] == 19', 'status.json()["schema_version"] == 20'),
              ],
              'tests/smoke.py': [
                  ('status.json()["schema_version"] == 19', 'status.json()["schema_version"] == 20'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'Missing expected schema assertion in {filename}: {old}')
                  text = text.replace(old, new)
                  print(f'{filename}: replaced {count} x {old!r}')
              if text == original:
                  raise SystemExit(f'No changes made to {filename}')
              path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/schema-020-regression-fix.yml
          git config user.name 'HomeServer CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/migrations.py tests/knowledge_sources.py tests/context_engine.py tests/knowledge_collections_v037.py tests/smoke.py
          git commit -m 'Update regressions for schema migration 020'
          git push origin HEAD:apps-one-click-installer
