name: HomeServer 2.3 Release Gate

on:
  pull_request:
    paths-ignore:
      - 'app/homeserver_apps_api.py'
      - 'app/services/homeserver_app_*.py'
      - 'ui/homeserver-apps.*'
      - 'app/services/homeserver_apps.py'
      - 'app/services/homeserver_app_sdk.py'
      - 'app/services/homeserver_app_packages.py'
      - 'app/services/homeserver_app_security.py'
      - 'app/services/homeserver_app_resources.py'
      - 'app/services/homeserver_app_runtime.py'
      - 'app/services/homeserver_app_sample_data.py'
      - 'ui/homeserver-apps.css'
      - 'ui/homeserver-apps.js'
      - 'app/services/homeserver_app_prebuilt.py'
      - 'ui/system.html'
      - 'ui/system.js'
      - 'sdk/homeserver-app/**'
      - 'tests/homeserver_apps_v1*.py'
      - '.github/workflows/homeserver-apps-v100.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/homeserver-v23-release.yml'
      - '.github/workflows/homeserver-v24-data-continuity.yml'
      - '.github/workflows/homeserver-v24-release.yml'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homeserver-v23-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  acceptance:
    name: Release acceptance · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile v2.3 execution release surfaces
        run: >-
          python -m py_compile
          app/config.py
          app/bridge.py
          app/services/remote_bridge.py
          app/services/local_voice.py
          app/services/agent_voice_profiles.py
          tests/homeserver_v23_release_acceptance.py
          tests/voice_profile_execution_v235.py
          tests/governed_actions_v230.py
      - name: Verify HomeServer 2.3 unified execution release acceptance
        run: python tests/homeserver_v23_release_acceptance.py
      - name: Verify governed local actions
        run: python tests/governed_actions_v230.py
      - name: Verify local voice and Profile Agent-safe execution
        run: python tests/voice_profile_execution_v235.py
      - name: Verify installer version and private-data contract
        run: python tests/installer_contract.py
