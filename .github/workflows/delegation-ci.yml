name: Agent Delegation CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  delegation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile delegation runtime
        run: python -m compileall app/delegation_api.py app/services/delegation.py tests/agent_delegation_v025.py
      - name: VP3 Agent Brain delegation regression
        run: python tests/agent_delegation_v025.py
