name: HomeServer Meeting Production Readiness v18.8

on:
  workflow_dispatch:

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Phase 18.8 meeting production runtime
        run: python -m py_compile app/services/meeting_transcription_control.py app/capability_registry_api.py tests/meeting_transcription_control_v1880.py tests/meeting_transcription_live_v1880.py
      - name: Phase 18.8 production control contract
        run: python tests/meeting_transcription_control_v1880.py
      - name: Verify production modules import with LiveKit runtime
        run: python -c "from livekit import rtc; from app.services import meeting_transcription_control; assert rtc.Room is not None; assert meeting_transcription_control.STATUS_OPERATION == 'meeting.transcription.status'; print('Phase 18.8 production imports passed')"
      - name: Verify live-validation entrypoint is present
        run: python -c "from pathlib import Path; p=Path('tests/meeting_transcription_live_v1880.py'); assert p.is_file() and 'VP3_MEETING_TRANSCRIPTION_PAYLOAD_JSON' in p.read_text(encoding='utf-8'); print('Phase 18.8 credentialed live validator is packaged')"
