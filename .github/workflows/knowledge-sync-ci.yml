name: HomeServer Knowledge Sync CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  knowledge-sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Knowledge Sources JavaScript
        run: node --check ui/knowledge-sources.js
      - name: Knowledge Sources UI integration contract
        run: python tests/knowledge_sources_ui_contract.py
      - name: Watched knowledge source regression
        run: python tests/knowledge_sources.py
