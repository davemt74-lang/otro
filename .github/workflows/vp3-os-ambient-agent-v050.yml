name: VP3 OS Ambient Agent v0.50

on:
  pull_request:
  push:
    branches:
      - main
      - vp3-os-v050-ambient-agent-runtime

permissions:
  contents: read

jobs:
  ambient-agent:
    name: Ambient agent · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile VP3 OS v0.50 runtime
        run: >-
          python -m py_compile
          app/services/vp3_os.py
          app/services/hardware_adapters.py
          app/services/physical_agent.py
          app/services/physical_meeting.py
          app/services/ambient_agent.py
          app/services/tasks.py
          app/services/cognitive_runtime.py
          app/services/device_audio.py
          app/main.py
          app/bridge.py
          app/vp3_os_api.py
          app/services/capability_registry.py
          tests/vp3_os_v020.py
          tests/vp3_os_v030.py
          tests/device_audio_v040.py
          tests/physical_meeting_v040.py
          tests/tasks_notifications.py
          tests/ambient_agent_v050.py
          tests/ambient_agent_ui_contract_v050.py
      - name: Validate Ambient Agent JavaScript
        run: node --check ui/ambient-agent.js
      - name: Verify v0.20 hardware adapter compatibility
        run: python tests/vp3_os_v020.py
      - name: Verify v0.30 Physical Agent compatibility
        run: python tests/vp3_os_v030.py
      - name: Verify v0.40 streaming device audio compatibility
        run: python tests/device_audio_v040.py
      - name: Verify v0.40 Physical Meeting compatibility
        run: python tests/physical_meeting_v040.py
      - name: Verify task notification compatibility
        run: python tests/tasks_notifications.py
      - name: Verify v0.50 Ambient Agent runtime
        run: python tests/ambient_agent_v050.py
      - name: Verify v0.50 Ambient Agent privacy/UI contract
        run: python tests/ambient_agent_ui_contract_v050.py
