  apps-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Apps foundation
        run: >-
          python -m py_compile
          app/bridge.py
          app/homeserver_apps_api.py
          app/services/homeserver_apps.py
          app/services/homeserver_app_sdk.py
          app/services/homeserver_app_packages.py
