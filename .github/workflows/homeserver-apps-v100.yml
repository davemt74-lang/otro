name: HomeServer Apps V1

on:
  pull_request:
    paths:
      - 'app/homeserver_apps_api.py'
      - 'app/services/homeserver_app_*.py'
      - 'app/services/homeserver_apps.py'
      - 'app/services/homeserver_app_sdk.py'
      - 'app/services/homeserver_app_packages.py'
      - 'app/services/homeserver_app_security.py'
      - 'app/services/homeserver_app_resources.py'
      - 'app/services/homeserver_app_runtime.py'
      - 'app/services/homeserver_app_sample_data.py'
      - 'tests/homeserver_apps_v170.py'
      - 'app/services/tools.py'
      - 'app/services/approvals.py'
      - 'app/services/agent_tools.py'
      - 'app/services/homeserver_app_agent.py'
      - 'tests/homeserver_apps_v150.py'
      - 'app/services/homeserver_app_prebuilt.py'
      - 'tests/homeserver_apps_v160.py'
      - 'app/services/homeserver_app_releases.py'
      - 'ui/app.js'
      - 'ui/homeserver-apps.*'
      - 'ui/index.html'
      - 'ui/homeserver-apps.css'
      - 'ui/homeserver-apps.js'
      - 'app/main.py'
      - 'app/services/local_apps.py'
      - 'app/services/local_app_catalog.py'
      - 'app/bridge.py'
      - 'database/migrations/059_homeserver_apps_registry.sql'
      - 'sdk/homeserver-app/**'
      - 'tests/homeserver_apps_v1*.py'
      - 'tests/homeserver_apps_v100.py'
      - 'tests/homeserver_apps_v110.py'
      - 'tests/homeserver_apps_v120.py'
      - 'tests/homeserver_apps_v130.py'
      - 'tests/homeserver_apps_v140.py'
      - 'tests/local_apps_v040.py'
      - 'tests/migrations.py'
      - 'ui/system.html'
      - 'ui/system.js'
      - '.github/workflows/homeserver-apps-v100.yml'
  push:
    branches: [main]
    paths:
      - 'app/homeserver_apps_api.py'
      - 'app/services/homeserver_apps.py'
      - 'database/migrations/059_homeserver_apps_registry.sql'
      - 'sdk/homeserver-app/**'
      - 'tests/homeserver_apps_v100.py'
      - '.github/workflows/homeserver-apps-v100.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeserver-apps-v100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apps-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Apps foundation
        run: >-
          python -m py_compile
          app/bridge.py
          app/homeserver_apps_api.py
          app/services/homeserver_apps.py
          app/services/homeserver_app_sdk.py
          app/services/homeserver_app_packages.py
          app/services/homeserver_app_security.py
          app/services/homeserver_app_resources.py
          app/services/homeserver_app_runtime.py
          app/services/homeserver_app_sample_data.py
          tests/homeserver_apps_v170.py
          app/services/tools.py
          app/services/approvals.py
          app/services/agent_tools.py
          app/services/homeserver_app_agent.py
          app/services/homeserver_app_prebuilt.py
          app/services/homeserver_app_releases.py
          app/main.py
          app/services/local_apps.py
          sdk/homeserver-app/create_app.py
          tests/homeserver_apps_v100.py
          tests/homeserver_apps_v110.py
          tests/homeserver_apps_v120.py
          tests/homeserver_apps_v130.py
          tests/homeserver_apps_v140.py
          tests/homeserver_apps_v150.py
          tests/homeserver_apps_v160.py
          tests/local_apps_v040.py
          tests/migrations.py
      - name: Validate Apps admin JavaScript
        run: node --check ui/system.js
      - name: Validate Apps manager JavaScript
        run: node --check ui/homeserver-apps.js
      - name: Verify migration chain
        run: python tests/migrations.py
      - name: Verify existing Local Apps compatibility
        run: python tests/local_apps_v040.py
      - name: Verify Apps registry lifecycle and SDK
        run: python tests/homeserver_apps_v100.py
      - name: Verify App package validation and runtime installation
        run: python tests/homeserver_apps_v110.py
      - name: Verify App permissions secrets and resource isolation
        run: python tests/homeserver_apps_v120.py
      - name: Verify App runtime routes data events and jobs
        run: python tests/homeserver_apps_v130.py
      - name: Verify Installed Apps manager
        run: python tests/homeserver_apps_v140.py
      - name: Verify VP3 prebuilt apps
        run: python tests/homeserver_apps_v150.py
      - name: Verify App updates rollback and recovery
        run: python tests/homeserver_apps_v160.py
      - name: Verify Apps Agent Chat and Agent Brain integration
        run: python tests/homeserver_apps_v170.py
