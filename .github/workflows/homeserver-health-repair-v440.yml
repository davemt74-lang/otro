name: HomeServer Health Repair v1.40

on:
  pull_request:
    paths:
      - 'app/bridge.py'
      - 'app/health_api.py'
      - 'app/services/health_repair.py'
      - 'app/services/runtime_diagnostics.py'
      - 'app/services/live_certification.py'
      - 'app/services/governed_recordings.py'
      - 'app/services/tasks.py'
      - 'database/governed_recordings.sql'
      - 'tests/governed_recordings_v502.py'
      - 'ui/governed-recordings.js'
      - 'ui/governed-recordings.css'
      - 'app/database.py'
      - 'database/runtime_certification.sql'
      - 'tests/live_certification_v501.py'
      - 'ui/live-certification.js'
      - 'ui/live-certification.css'
      - 'tests/runtime_diagnostics_v500.py'
      - 'ui/runtime-diagnostics.js'
      - 'ui/runtime-diagnostics.css'
      - 'ui/index.html'
      - 'app/services/canonical_context.py'
      - 'app/services/tools.py'
      - 'tests/homeserver_health_repair_v440.py'
      - 'tests/canonical_agent_context_v430.py'
      - 'tests/smoke.py'
      - 'ui/app.js'
      - 'ui/health.css'
      - '.github/workflows/homeserver-health-repair-v440.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeserver-health-repair-v440-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  health-repair:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Health runtime
        run: >-
          python -m py_compile
          app/bridge.py
          app/health_api.py
          app/services/health_repair.py
          app/services/runtime_diagnostics.py
          app/services/live_certification.py
          app/services/governed_recordings.py
          tests/governed_recordings_v502.py
          tests/live_certification_v501.py
          tests/runtime_diagnostics_v500.py
          app/services/canonical_context.py
          app/services/tools.py
          tests/homeserver_health_repair_v440.py
          tests/canonical_agent_context_v430.py
          tests/smoke.py
      - name: Validate Health UI JavaScript
        run: node --check ui/app.js
      - name: Check runtime diagnostics UI
        run: node --check ui/runtime-diagnostics.js
      - name: Verify certification UI syntax
        run: node --check ui/live-certification.js
      - name: Validate private recording UI syntax
        run: node --check ui/governed-recordings.js
      - name: Verify consent-governed recordings and separate saved transcription
        run: python tests/governed_recordings_v502.py
      - name: Verify owner-only bounded live certification using synthetic test hardware
        run: python tests/live_certification_v501.py
      - name: Verify installed-machine inventory without capture
        run: python tests/runtime_diagnostics_v500.py
      - name: Verify Section 30 health and repair orchestration
        run: python tests/homeserver_health_repair_v440.py
      - name: Verify canonical Agent Chat/Brain health integration
        run: python tests/canonical_agent_context_v430.py
      - name: Verify smoke contract
        if: runner.os == 'Linux'
        run: python tests/smoke.py
