name: HomeServer v2.4 Release Acceptance

on:
  pull_request:
    paths:
      - 'app/services/**'
      - 'app/tasks_api.py'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homeserver-v24-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feature/hosting-v2') || endsWith(github.head_ref, '-section5') || endsWith(github.head_ref, '-section10') }}
    name: v2.4 acceptance · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile release acceptance surfaces
        run: >-
          python -m py_compile
          app/config.py
          app/bridge.py
          app/services/federated_data.py
          app/services/task_calendar_continuity.py
          app/services/file_continuity.py
          app/services/memory_continuity.py
          app/services/shared_agent_context.py
          app/services/remote_bridge.py
          app/services/tracky_physical_context.py
          app/services/tracky_governed_actions.py
          app/services/tracky_federated_world.py
          app/services/tracky_federation_sync.py
          app/services/tracky_mobile_transition.py
          app/services/tracky_identity_continuity.py
          app/services/tracky_federated_agent_context.py
          app/services/tracky_federation_policy.py
          app/services/tracky_federated_query.py
          app/services/tracky_federation_reconciliation.py
          app/services/tracky_federation_operations.py
          app/services/tracky_physical_world_dashboard.py
          app/services/tracky_cross_site_presence.py
          app/services/tracky_sync_visibility.py
          app/services/tracky_federation_access_operations.py
          app/services/tracky_federation_agent_health.py
          app/services/tracky_forecast_calibration.py
          app/services/tracky_model_lifecycle.py
          app/services/tracky_site_topology.py
          app/services/hosting_runtime.py
          app/services/hosting_deployment.py
          app/services/hosting_serving.py
          app/services/hosting_cloud_control.py
          app/services/hosting_recovery.py
          app/services/hosting_diagnostics.py
          app/services/hosting_health_recovery.py
          app/hosting_api.py
          tests/hosting_runtime_v100.py
          tests/hosting_deployment_v110.py
          tests/hosting_serving_v120.py
          tests/hosting_cloud_control_v130.py
          tests/hosting_cloud_remote_v130.py
          tests/hosting_recovery_v140.py
          tests/hosting_release_history_v220.py
          tests/hosting_diagnostics_v230.py
          tests/hosting_health_recovery_v240.py
          app/tracky_api.py
          tests/federated_data_authority_v240.py
          tests/contacts_continuity_v241.py
          tests/knowledge_continuity_v242.py
          tests/task_calendar_continuity_v243.py
          tests/file_document_continuity_v244.py
          tests/agent_brain_memory_continuity_v245.py
          tests/reconnect_reconciliation_v246.py
          tests/tracky_contract_join_v273.py
          tests/tracky_reliability_v274.py
          tests/tracky_governed_actions_v275.py
          tests/tracky_forecast_calibration_v276.py
          tests/tracky_model_lifecycle_v277.py
          tests/tracky_site_topology_v278.py
          tests/tracky_federated_world_v278.py
          tests/tracky_federation_sync_v278.py
          tests/tracky_mobile_transition_v278.py
          tests/tracky_identity_continuity_v278.py
          tests/tracky_federated_agent_context_v278.py
          tests/tracky_federation_policy_v278.py
          tests/tracky_federated_query_v278.py
          tests/tracky_federation_reconciliation_v278.py
          tests/tracky_golden_multisite_release_v278.py
          tests/tracky_federation_operations_v280.py
          tests/tracky_federation_control_center_v280.py
          tests/tracky_physical_world_dashboard_v280.py
          tests/tracky_cross_site_presence_v280.py
          tests/tracky_sync_visibility_v280.py
          tests/tracky_federation_access_operations_v280.py
          tests/tracky_federation_agent_health_v280.py
          tests/fixtures/tracky_v274_resilience_vectors.json
          tests/homeserver_v23_release_acceptance.py
          tests/homeserver_v24_release_acceptance.py
      - name: Verify migration chain through schema 52
        run: python tests/migrations.py
      - name: Verify v2.4 federated authority
        run: python tests/federated_data_authority_v240.py
      - name: Verify v2.4 contacts continuity
