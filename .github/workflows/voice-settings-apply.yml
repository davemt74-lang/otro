name: Voice Settings Apply

on:
  push:
    branches:
      - voice-settings
    paths:
      - .github/workflows/voice-settings-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice-settings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded integration patch
        run: python .github/voice_settings_apply.py
      - name: Commit integrated Voice Settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Voice Settings with Agent Chat"
          git push origin HEAD:voice-settings
