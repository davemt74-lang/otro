name: VP3 Stonefellow Native Music 84B7
on:
  pull_request:
    paths:
      - 'app/services/stonefellow_native.py'
      - 'app/member_api.py'
      - 'ui/member.js'
      - 'ui/member.html'
      - 'tests/stonefellow_native_84b7.py'
      - '.github/workflows/stonefellow-native-84b7.yml'
  push:
    branches: [main]
    paths:
      - 'app/services/stonefellow_native.py'
      - 'app/member_api.py'
      - 'ui/member.js'
      - 'ui/member.html'
      - 'tests/stonefellow_native_84b7.py'
jobs:
  member-music:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1' 'fastapi>=0.110,<1'
      - run: python -m py_compile app/services/stonefellow_native.py app/member_api.py tests/stonefellow_native_84b7.py
      - run: node --check ui/member.js
      - run: python tests/stonefellow_native_84b7.py
      - run: python tests/stonefellow_native_84b6.py
