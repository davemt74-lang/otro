name: Agent Mission Tool Orchestration A5C
on:
  pull_request:
    paths:
      - 'app/**'
      - 'database/migrations/07*_agent_mission*.sql'
      - 'database/agent_mission_orchestration.sql'
      - 'database/agent_mission_actions.sql'
      - 'database/agent_mission_outcomes.sql'
      - 'database/agent_mission_chat_tasks.sql'
      - 'database/agent_mission_chat_routes.sql'
      - 'database/agent_mission_schedules.sql'
      - 'ui/agent-browser-workspaces.js'
      - 'tests/*a5c*'
      - '.github/workflows/agent-mission-tools-a5c.yml'
  push:
    branches: [main]
    paths:
      - 'app/services/agent_mission*.py'
      - 'app/agent_mission_tools_api.py'
      - 'database/migrations/07*_agent_mission*.sql'
      - 'database/agent_mission_orchestration.sql'
      - 'database/agent_mission_actions.sql'
      - 'database/agent_mission_outcomes.sql'
      - 'database/agent_mission_chat_tasks.sql'
      - 'database/agent_mission_chat_routes.sql'
      - 'database/agent_mission_schedules.sql'
      - 'ui/agent-browser-workspaces.js'
      - 'tests/*a5c*'
      - '.github/workflows/agent-mission-tools-a5c.yml'
concurrency:
  group: a5c-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Specialist capability contracts
        run: python tests/agent_mission_contracts_a5c1.py
      - name: Durable coordinated execution and authority fences
        run: python tests/agent_mission_orchestration_a5c2.py
      - name: Governed specialist changes and exact owner reviews
        run: python tests/agent_mission_actions_a5c3.py
      - name: Receipt readback, completion and safe delivery recovery
        run: python tests/agent_mission_outcomes_a5c4.py
      - name: Chat-to-task preparation and verified completion
        run: python tests/agent_mission_chat_tasks_a5c5.py
      - name: Native Chrome research owner and privacy boundaries
        run: python tests/chat_browser_research.py
      - name: Synchronized browser annotation privacy and native Brain retrieval
        run: python tests/browser_captures_r4.py
      - name: Chat follow-up commands, exact reviews and mission continuity
        run: python tests/agent_mission_followups_a5c9.py
      - name: Check out the certified Cloud counterpart
        uses: actions/checkout@v4
        with:
          repository: davemt74-lang/software
          ref: da9d186da51b310baa702c6064cac03d9e754bae
          path: _certification/cloud
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: Reviewed source discovery consent and frozen plans
        run: |
          php _certification/cloud/tests/chat-research-discovery-r2.php
          php _certification/cloud/tests/chat-research-continuity-r3.php
          php _certification/cloud/tests/chat-research-canonical-r3.php
      - name: Saved research native Chat continuity and revocation
        run: python tests/chat_research_continuity_r3.py
      - name: Verify complete source capability outline
        run: |
          python scripts/build_agent_capability_outline.py --cloud-root _certification/cloud --output _certification/outline
          diff docs/Agent-Skills-and-Tools-A5C11.json _certification/outline/Agent-Skills-and-Tools-A5C11.json
          diff docs/Agent-Skills-and-Tools-A5C11.md _certification/outline/Agent-Skills-and-Tools-A5C11.md
      - name: Cross-system mission lifecycle and production receipt recovery
        run: python tests/agent_mission_lifecycle_a5c10.py --cloud-root _certification/cloud
      - name: Reviewed Chat browser research and paired integration diagnostics
        run: python tests/agent_mission_browser_chat_a5c11.py --cloud-root _certification/cloud
      - name: Live mission progress, durable notices and stall recovery
        run: python tests/agent_mission_progress_a5c8.py
      - name: Automatic routing, authority and interrupted preparation recovery
        run: python tests/agent_mission_chat_routes_a5c7.py
      - name: Reviewed scheduled tasks, duplicate prevention and recovery
        run: python tests/agent_mission_schedules_a5c6.py
      - name: Existing specialist and relay regressions
        run: |
          set -e
          python tests/agent_mission_runtime_a1.py
          python tests/agent_mission_control_a2.py
          python tests/agent_mission_cloud_a3.py
          python tests/agent_mission_cognition_a4.py
          python tests/agent_mission_execution_a5.py
          python tests/agent_mission_browser_plans_a5b4.py
          python tests/migrations.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser acceptance runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Native workspace reviewed specialist controls
        run: node tests/agent_mission_orchestration_a5c2_browser.mjs
      - name: Native exact specialist change review
        run: node tests/agent_mission_actions_a5c3_browser.mjs
      - name: Native verified outcome and recovery presentation
        run: node tests/agent_mission_outcomes_a5c4_browser.mjs
      - name: Native ordinary composer task mode
        run: node tests/agent_mission_chat_tasks_a5c5_browser.mjs
      - name: Native scheduled specialist controls
        run: node tests/agent_mission_schedules_a5c6_browser.mjs
      - name: Native automatic delegation browser acceptance
        run: node tests/agent_mission_chat_routes_a5c7_browser.mjs
      - name: Native live mission progress and notification drawer
        run: node tests/agent_mission_progress_a5c8_browser.mjs
      - name: Native chat follow-up review and continuity
        run: node tests/agent_mission_followups_a5c9_browser.mjs

      - name: Native lifecycle completion and all-surface revocation
        run: node tests/agent_mission_lifecycle_a5c10_browser.mjs

      - name: Native browser research grants, citations and diagnostics
        run: node tests/agent_mission_browser_chat_a5c11_browser.mjs
      - name: Chrome multi-source research on the native Chat canvas
        run: |
          node tests/chat_browser_research_ui_browser.mjs
          node tests/chat_research_continuity_r3_ui_browser.mjs --native
