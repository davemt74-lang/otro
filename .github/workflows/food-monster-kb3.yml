name: KB3 OTRO Food Monster Private Connections
on:
  pull_request:
    paths:
      - 'app/services/food_monster_connector.py'
      - 'app/main.py'
      - 'database/migrations/030_food_monster_connections.sql'
      - 'tests/food_monster_kb3.py'
      - 'docs/FOOD_MONSTER_KB3_CONNECTOR.md'
      - '.github/workflows/food-monster-kb3.yml'
  push:
    branches: [main]
    paths:
      - 'app/services/food_monster_connector.py'
      - 'app/main.py'
      - 'database/migrations/030_food_monster_connections.sql'
      - 'tests/food_monster_kb3.py'
      - 'docs/FOOD_MONSTER_KB3_CONNECTOR.md'
      - '.github/workflows/food-monster-kb3.yml'
jobs:
  verify-connection-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only needed HTTP API dependencies
        run: python -m pip install fastapi==0.115.6 pydantic==2.10.4 httpx==0.28.1
      - name: Parse connector and local API syntax
        run: |
          python -m py_compile app/services/food_monster_connector.py app/main.py tests/food_monster_kb3.py
      - name: Pairing, origin policy, secret isolation and revocation acceptance
        run: PYTHONPATH=. python tests/food_monster_kb3.py
