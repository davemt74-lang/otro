name: Agent Chat Browser Acceptance
on:
  pull_request:
    paths: [ui/**, app/services/vrss.py, app/vrss_api.py, tests/vrss_v1*, tests/chat_workspace_browser.mjs, tests/project_knowledge_context_ui.mjs, tests/chat_action_result_ownership_ui.mjs, tests/social_feed_v1.py, tests/social_feed_v1_browser.mjs, .github/workflows/chat-workspace-browser.yml]
  push:
    branches: [main]
    paths: [ui/**, app/services/vrss.py, app/vrss_api.py, tests/vrss_v1*, tests/chat_workspace_browser.mjs, tests/project_knowledge_context_ui.mjs, tests/chat_action_result_ownership_ui.mjs, tests/social_feed_v1.py, tests/social_feed_v1_browser.mjs, .github/workflows/chat-workspace-browser.yml]
permissions:
  contents: read
concurrency:
  group: chat-workspace-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Complete owner chat browser acceptance
        run: |
          python tests/social_feed_v1.py
          python tests/vrss_v1.py
          python tests/vrss_v1_hosting.py
          node tests/vrss_v1_browser.mjs
          node tests/social_feed_v1_browser.mjs
          node tests/chat_action_result_ownership_ui.mjs
          node tests/chat_workspace_browser.mjs
          node tests/project_knowledge_context_ui.mjs
          node tests/browser_captures_r4_ui.mjs
