name: Agent Chat Browser Acceptance
on:
  pull_request:
    paths: [ui/**, app/services/vrss*.py, app/vrss_api.py, tests/vrss_*, tests/chat_workspace_browser.mjs, tests/project_knowledge_context_ui.mjs, tests/chat_action_result_ownership_ui.mjs, tests/social_feed_v1.py, tests/social_feed_v1_browser.mjs, .github/workflows/chat-workspace-browser.yml]
  push:
    branches: [main]
    paths: [ui/**, app/services/vrss*.py, app/vrss_api.py, tests/vrss_*, tests/chat_workspace_browser.mjs, tests/project_knowledge_context_ui.mjs, tests/chat_action_result_ownership_ui.mjs, tests/social_feed_v1.py, tests/social_feed_v1_browser.mjs, .github/workflows/chat-workspace-browser.yml]
permissions:
  contents: read
concurrency:
  group: chat-workspace-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    # Dependency downloads can consume eight minutes before browser acceptance starts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Agent Eyes participant lifecycle
        run: node tests/agent-eyes-core.mjs
      - name: Floating Agent and Agent Eyes browser acceptance
        run: |
          node tests/agent-orb-browser.mjs
          node tests/agent-orb-home-browser.mjs
          node tests/agent-voice-guard-browser.mjs
          node tests/participant-continuity-browser.mjs
          python tests/voice_speaker_context.py
      - name: Complete owner chat browser acceptance
        run: |
          python tests/social_feed_v1.py
          python tests/vrss_v1.py
          python tests/vrss_v1_hosting.py
          python tests/vrss_v2b.py
          python tests/vrss_v2c.py
          python tests/vrss_v2c_tls.py
          python tests/vrss_v2d.py
          python tests/vrss_v2d_tls.py
          python tests/vrss_shutdown.py
          python tests/vrss_v2e.py
          python tests/vrss_v2e_tls.py
          python tests/vrss_v2f.py
          python tests/vrss_v2f_tls.py
          python tests/vrss_v2g.py
          python tests/vrss_v2g_tls.py
          node tests/vrss_v1_browser.mjs
          node tests/vrss_v2c_browser.mjs
          node tests/vrss_v2d_browser.mjs
          node tests/vrss_v2e_browser.mjs
          node tests/vrss_v2f_browser.mjs
          node tests/vrss_v2g_browser.mjs
          node tests/social_feed_v1_browser.mjs
          node tests/chat_action_result_ownership_ui.mjs
          node tests/chat_workspace_browser.mjs
          node tests/project_knowledge_context_ui.mjs
          node tests/browser_captures_r4_ui.mjs
