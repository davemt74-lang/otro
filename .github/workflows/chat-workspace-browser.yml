name: Agent Chat Browser Acceptance
on:
  pull_request:
    paths: [ui/**, tests/chat_workspace_browser.mjs, .github/workflows/chat-workspace-browser.yml]
  push:
    branches: [main]
    paths: [ui/**, tests/chat_workspace_browser.mjs, .github/workflows/chat-workspace-browser.yml]
permissions:
  contents: read
concurrency:
  group: chat-workspace-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Complete owner chat browser acceptance
        run: node tests/chat_workspace_browser.mjs
