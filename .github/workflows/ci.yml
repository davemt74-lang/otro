name: HomeServer CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: homeserver-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app desktop tests
      - name: Validate control center JavaScript
        run: node --check ui/app.js
      - name: Validate system workspace JavaScript
        run: node --check ui/system.js
      - name: Validate remote bridge JavaScript
        run: node --check ui/remote.js
      - name: Validate Agent Brain JavaScript
        run: node --check ui/brain.js
      - name: Validate agent-first shell JavaScript
        run: node --check ui/shell.js
      - name: Validate Skills and Tools JavaScript
        run: node --check ui/tools.js
      - name: Validate Approvals JavaScript
        run: node --check ui/approvals.js
      - name: Validate Contacts JavaScript
        run: node --check ui/contacts.js
      - name: Validate Knowledge Sources JavaScript
        run: node --check ui/knowledge-sources.js
      - name: Validate Cognition workspace JavaScript
        run: node --check ui/cognition.js
      - name: Validate Tasks and Notifications JavaScript
        run: node --check ui/tasks.js
      - name: Validate authorization JavaScript
        run: node --check ui/authorize.js
      - name: Validate VP3 bridge JavaScript
        run: node --check connectors/vp3/client.js
      - name: Agent-first shell integration regression
        run: python tests/agent_shell_contract.py
      - name: Database migration upgrade test
        run: python tests/migrations.py
      - name: Cognition workspace UI integration contract
        run: python tests/cognition_ui_contract.py
      - name: Cognitive runtime and plugin bus regression
        run: python tests/cognitive_runtime.py
      - name: Watched knowledge source regression
        run: python tests/knowledge_sources.py
      - name: Inference routing and token usage regression
        run: python tests/inference_usage.py
      - name: Windows data bootstrap regression
        run: python tests/bootstrap.py
      - name: Single-instance primitive regression
        run: python tests/single_instance.py
      - name: Windows reliability and owner-system regression
        run: python tests/system_reliability.py
      - name: Restricted recovery-mode regression
        run: python tests/recovery.py
      - name: Installer upgrade contract regression
        run: python tests/installer_contract.py
      - name: Remote bridge security and operation-map regression
        run: python tests/remote_bridge.py
      - name: Outbound WebSocket bridge protocol regression
        run: python tests/remote_bridge_socket.py
      - name: VP3 account-token pairing regression
        run: python tests/vp3_account_pairing_v062.py
      - name: VP3 HTTPS session replacement race regression
        run: python tests/vp3_https_session_race.py
      - name: VP3 HTTPS bidirectional relay regression
        run: python tests/vp3_https_relay_v019.py
      - name: Shared Agent fabric, ping and context regression
        run: python tests/shared_agent_context_v210.py
      - name: Federated data authority v2.4 regression
        run: python tests/federated_data_authority_v240.py
      - name: Contacts continuity v2.4 regression
        run: python tests/contacts_continuity_v241.py
      - name: Knowledge continuity v2.4 regression
        run: python tests/knowledge_continuity_v242.py
      - name: Tasks and Calendar continuity v2.4 regression
        run: python tests/task_calendar_continuity_v243.py
      - name: Files and Documents continuity v2.4 regression
        run: python tests/file_document_continuity_v244.py
      - name: Agent Brain and Memory continuity v2.4 regression
        run: python tests/agent_brain_memory_continuity_v245.py
      - name: Disconnect/Reconnect reconciliation v2.4 regression
        run: python tests/reconnect_reconciliation_v246.py
      - name: HomeServer v2.4 final release acceptance
        run: python tests/homeserver_v24_release_acceptance.py
      - name: Governed HomeServer actions v2.3 regression
        run: python tests/governed_actions_v230.py
      - name: Voice and profile-safe local execution v2.3 regression
        run: python tests/voice_profile_execution_v235.py
      - name: HomeServer 2.3 unified execution release acceptance
        run: python tests/homeserver_v23_release_acceptance.py
      - name: Universal shell, Agent presence and execution routing regression
        run: python tests/universal_shell_v220.py
      - name: Smoke test API, pairing, Agent Brain and tools
        run: python tests/smoke.py
      - name: Tool audit privacy regression
        run: python tests/tools_security.py
      - name: Agent read-tool regression
        run: python tests/agent_tools.py
      - name: Agent tool failure-audit regression
        run: python tests/agent_tools_failure.py
      - name: Action approval regression
        run: python tests/action_approvals.py
      - name: Tasks reminders notifications regression
        run: python tests/tasks_notifications.py
      - name: Contacts permission and Agent Tool regression
        run: python tests/contacts.py
      - name: Contact literal wildcard regression
        run: python tests/contacts_wildcards.py
      - name: Backup integrity, staging and rollback regression
        run: python tests/backups.py
      - name: Backup owner boundary and path security regression
        run: python tests/backup_security.py
      - name: Build executable
        run: pyinstaller HomeServer.spec --clean --noconfirm
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-exe-smoke'
          $process = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 2
                if ($response.ok -eq $true -and $response.version -eq '2.4') {
                  $healthy = $true
                  break
                }
              } catch {
                $process.Refresh()
                if ($process.HasExited) {
                  throw "HomeServer.exe exited before becoming healthy with code $($process.ExitCode)"
                }
              }
            }
            if (-not $healthy) { throw 'HomeServer.exe did not become healthy on 127.0.0.1:4377 as v2.4' }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Packaged smoke left a HomeServer listener on port 4377'
          }
      - name: Verify packaged v2.1 to v2.4 upgrade takeover
        shell: pwsh
        run: |
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Port 4377 is occupied before the upgrade-takeover smoke test'
          }
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-upgrade-takeover'
          Remove-Item -Recurse -Force $env:HOMESERVER_DATA_DIR -ErrorAction SilentlyContinue
          $old = Start-Process -FilePath 'python' -ArgumentList 'tests/mock_old_homeserver.py' -PassThru
          try {
            $oldHealthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 300
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 1
                if ($response.version -eq '2.1') { $oldHealthy = $true; break }
              } catch {}
            }
            if (-not $oldHealthy) { throw 'Old HomeServer fixture did not become healthy' }

            $new = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless','--replace-running' -PassThru
            $newHealthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 1
                if ($response.version -eq '2.4') { $newHealthy = $true; break }
              } catch {
                $new.Refresh()
                if ($new.HasExited) { throw "New HomeServer exited during takeover with code $($new.ExitCode)" }
              }
            }
            if (-not $newHealthy) { throw 'New HomeServer did not replace the old running instance' }

            $old.Refresh()
            if (-not $old.HasExited) { throw 'Old HomeServer process remained alive after upgrade takeover' }
          } finally {
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($old -and -not $old.HasExited) { Stop-Process -Id $old.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Upgrade-takeover smoke left a HomeServer listener on port 4377'
          }

      - name: Verify packaged single-instance enforcement
        shell: pwsh
        run: |
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-exe-single-instance'
          $primary = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 2
                if ($response.ok -eq $true -and $response.version -eq '2.4') { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw 'Primary HomeServer process never became healthy' }
            $secondary = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
            Wait-Process -Id $secondary.Id -Timeout 10
            $secondary.Refresh()
            if (-not $secondary.HasExited) { throw 'Second HomeServer instance did not exit' }
            if ($secondary.ExitCode -ne 23) { throw "Second HomeServer instance exited with $($secondary.ExitCode), expected 23" }
            $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 2
            if ($response.ok -ne $true) { throw 'Primary HomeServer was disrupted by the rejected second instance' }
          } finally {
            $primary.Refresh()
            if (-not $primary.HasExited) { & taskkill.exe /PID $primary.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Single-instance smoke left a listener on port 4377'
          }
      - name: Verify packaged graceful restart and shutdown
        shell: pwsh
        run: |
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Port 4377 is occupied before the lifecycle smoke test'
          }
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-exe-lifecycle'
          $process = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
          try {
            python tests/packaged_lifecycle.py
            if ($LASTEXITCODE -ne 0) { throw "Packaged lifecycle test failed with exit code $LASTEXITCODE" }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Lifecycle smoke left a HomeServer listener on port 4377'
          }
      - name: Verify packaged outbound Remote Bridge
        shell: pwsh
        run: |
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Port 4377 is occupied before the remote bridge smoke test'
          }
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-exe-remote'
          $env:HOMESERVER_REMOTE_TEST_PORT = '48765'
          $marker = Join-Path $env:RUNNER_TEMP 'homeserver-remote-marker.json'
          $tokenFile = Join-Path $env:RUNNER_TEMP 'homeserver-remote-token.txt'
          $progress = Join-Path $env:RUNNER_TEMP 'homeserver-remote-progress.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          Remove-Item $tokenFile -ErrorAction SilentlyContinue
          Remove-Item $progress -ErrorAction SilentlyContinue
          $env:HOMESERVER_REMOTE_MARKER = $marker
          $env:HOMESERVER_REMOTE_TOKEN_FILE = $tokenFile
          $env:HOMESERVER_REMOTE_PROGRESS = $progress
          python tests/remote_packaged_setup.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the packaged remote bridge fixture' }
          $broker = Start-Process -FilePath 'python' -ArgumentList 'tests/mock_remote_broker.py' -PassThru
          Start-Sleep -Milliseconds 800
          $process = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
          try {
            $completed = $false
            for ($attempt = 0; $attempt -lt 35; $attempt++) {
              Start-Sleep -Seconds 1
              if (Test-Path $marker) { $completed = $true; break }
              $process.Refresh()
              if ($process.HasExited) { throw "HomeServer.exe exited during remote bridge smoke with code $($process.ExitCode)" }
              $broker.Refresh()
              if ($broker.HasExited) {
                $stage = if (Test-Path $progress) { (Get-Content $progress -Raw).Trim() } else { 'unknown' }
                throw "Mock broker exited before exchange with code $($broker.ExitCode) at stage $stage"
              }
            }
            if (-not $completed) {
              $stage = if (Test-Path $progress) { (Get-Content $progress -Raw).Trim() } else { 'unknown' }
              throw "Packaged HomeServer did not complete the outbound relay exchange; broker stage: $stage"
            }
            $rawResult = Get-Content $marker -Raw
            Write-Host "Remote bridge result: $rawResult"
            $result = $rawResult | ConvertFrom-Json
            if ($result.ok -ne $true -or $result.response_status -ne 200 -or $result.allowed_status -ne 200 -or $result.denied_status -ne 403) {
              throw "Packaged remote bridge permission marker was invalid at stage $($result.stage)"
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
            $broker.Refresh()
            if (-not $broker.HasExited) { & taskkill.exe /PID $broker.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Remove-Item $tokenFile -ErrorAction SilentlyContinue
            Remove-Item $progress -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Remote bridge smoke left a HomeServer listener on port 4377'
          }
      - name: Verify packaged VP3 HTTPS session survives process restart
        shell: pwsh
        run: |
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Port 4377 is occupied before the HTTPS reconnect smoke test'
          }
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-https-reconnect'
          $env:HOMESERVER_HTTPS_RECONNECT_PORT = '48766'
          $config = Join-Path $env:RUNNER_TEMP 'homeserver-https-reconnect-config.json'
          $marker = Join-Path $env:RUNNER_TEMP 'homeserver-https-reconnect-marker.json'
          $progress = Join-Path $env:RUNNER_TEMP 'homeserver-https-reconnect-progress.txt'
          $restartFlag = Join-Path $env:RUNNER_TEMP 'homeserver-https-reconnect-restart.flag'
          Remove-Item -Recurse -Force $env:HOMESERVER_DATA_DIR -ErrorAction SilentlyContinue
          Remove-Item $config,$marker,$progress,$restartFlag -ErrorAction SilentlyContinue
          $env:HOMESERVER_HTTPS_RECONNECT_CONFIG = $config
          $env:HOMESERVER_HTTPS_RECONNECT_MARKER = $marker
          $env:HOMESERVER_HTTPS_RECONNECT_PROGRESS = $progress
          $env:HOMESERVER_HTTPS_RECONNECT_RESTART_FLAG = $restartFlag

          python tests/https_packaged_reconnect_setup.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure packaged VP3 HTTPS reconnect fixture' }

          $relay = Start-Process -FilePath 'python' -ArgumentList 'tests/mock_https_relay_reconnect.py' -PassThru
          Start-Sleep -Milliseconds 600
          $first = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
          $second = $null
          try {
            $pingComplete = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $progress) {
                $stage = (Get-Content $progress -Raw).Trim()
                if ($stage -eq 'ping-complete') { $pingComplete = $true; break }
                if ($stage -eq 'failed') { break }
              }
              $first.Refresh()
              if ($first.HasExited) { throw "HomeServer exited before the first HTTPS round trip with code $($first.ExitCode)" }
              $relay.Refresh()
              if ($relay.HasExited) { throw "Mock HTTPS relay exited before the first round trip with code $($relay.ExitCode)" }
            }
            if (-not $pingComplete) {
              $stage = if (Test-Path $progress) { (Get-Content $progress -Raw).Trim() } else { 'unknown' }
              $detail = if (Test-Path $marker) { Get-Content $marker -Raw } else { '' }
              throw "Initial Cloud -> HomeServer -> Cloud ping did not complete. Stage: $stage $detail"
            }

            & taskkill.exe /PID $first.Id /T /F | Out-Null
            Wait-Process -Id $first.Id -Timeout 10 -ErrorAction SilentlyContinue
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              if (-not (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Milliseconds 250
            }
            if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
              throw 'First packaged HomeServer listener remained active after simulated process restart'
            }

            Set-Content -Encoding ascii $restartFlag 'restart-now'
            $second = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
            $completed = $false
            for ($attempt = 0; $attempt -lt 70; $attempt++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $marker) {
                $raw = Get-Content $marker -Raw
                $result = $raw | ConvertFrom-Json
                if ($result.ok -eq $true -and $result.stage -eq 'complete') { $completed = $true; break }
                if ($result.ok -eq $false) { throw "HTTPS reconnect fixture failed: $raw" }
              }
              $second.Refresh()
              if ($second.HasExited) { throw "HomeServer exited after restart before reconnect completed with code $($second.ExitCode)" }
              $relay.Refresh()
              if ($relay.HasExited) { throw "Mock HTTPS relay exited before reconnect completed with code $($relay.ExitCode)" }
            }
            if (-not $completed) {
              $stage = if (Test-Path $progress) { (Get-Content $progress -Raw).Trim() } else { 'unknown' }
              throw "HomeServer did not reconnect and resume shared context after restart. Stage: $stage"
            }

            $result = (Get-Content $marker -Raw) | ConvertFrom-Json
            if ($result.ping_verified -ne $true -or $result.shared_verified -ne $true) {
              throw 'Packaged HTTPS reconnect proof did not validate ping and shared context'
            }
            $sessionPath = Join-Path $env:HOMESERVER_DATA_DIR 'security\vp3-https-session.dat'
            if (-not (Test-Path $sessionPath)) { throw 'VP3 HTTPS session was not preserved across restart' }
          } finally {
            if ($second) {
              $second.Refresh()
              if (-not $second.HasExited) { & taskkill.exe /PID $second.Id /T /F | Out-Null }
            }
            $first.Refresh()
            if (-not $first.HasExited) { & taskkill.exe /PID $first.Id /T /F | Out-Null }
            $relay.Refresh()
            if (-not $relay.HasExited) { & taskkill.exe /PID $relay.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'HTTPS reconnect smoke left a HomeServer listener on port 4377'
          }
      - name: Smoke test packaged recovery mode
        shell: pwsh
        run: |
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-exe-recovery'
          New-Item -ItemType Directory -Force -Path $env:HOMESERVER_DATA_DIR | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $env:HOMESERVER_DATA_DIR 'homeserver.db'), [byte[]](1,2,3,4,5,6,7,8))
          $process = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
          $recovery = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 2
                if ($response.recovery -eq $true -and $response.ok -eq $false -and $response.version -eq '2.4') {
                  $recovery = $true
                  break
                }
              } catch {
                $process.Refresh()
                if ($process.HasExited) { throw "Recovery HomeServer.exe exited with code $($process.ExitCode)" }
              }
            }
            if (-not $recovery) { throw 'Packaged HomeServer did not enter recovery mode for an invalid database' }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
      - name: Smoke test packaged staged restore
        shell: pwsh
        run: |
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Port 4377 is already occupied before the staged-restore smoke test'
          }
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-exe-restore'
          python tests/packaged_restore.py setup
          $process = Start-Process -FilePath (Resolve-Path 'dist/HomeServer.exe') -ArgumentList '--headless' -PassThru
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 2
                if ($response.ok -eq $true -and $response.version -eq '2.4') {
                  $healthy = $true
                  break
                }
              } catch {
                $process.Refresh()
                if ($process.HasExited) {
                  throw "HomeServer.exe exited during staged restore with code $($process.ExitCode)"
                }
              }
            }
            if (-not $healthy) { throw 'HomeServer.exe did not become healthy after applying the staged restore' }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Packaged restore smoke left a HomeServer listener on port 4377'
          }
          python tests/packaged_restore.py verify
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not found' }
          & $compiler 'installer\HomeServer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Verify silent installer upgrade preserves private data
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/HomeServerSetup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'HomeServerInstalled'
          $privateDir = Join-Path $env:LOCALAPPDATA 'HomeServer\Data'
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $privateDir -ErrorAction SilentlyContinue
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir",'/TASKS=""')
          $first = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw "First silent install failed with $($first.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'HomeServer.exe'))) { throw 'Installed HomeServer.exe missing' }
          New-Item -ItemType Directory -Force -Path $privateDir | Out-Null
          Set-Content -Encoding utf8 (Join-Path $privateDir 'upgrade-sentinel.txt') 'preserve-me'
          $second = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($second.ExitCode -ne 0) { throw "Upgrade install failed with $($second.ExitCode)" }
          if ((Get-Content (Join-Path $privateDir 'upgrade-sentinel.txt') -Raw).Trim() -ne 'preserve-me') {
            throw 'Installer upgrade modified private HomeServer data'
          }

          $installedExe = Join-Path $installDir 'HomeServer.exe'
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-installed-launch'
          Remove-Item -Recurse -Force $env:HOMESERVER_DATA_DIR -ErrorAction SilentlyContinue
          $installed = Start-Process -FilePath $installedExe -ArgumentList '--headless' -PassThru
          $installedHealthy = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 2
                if ($response.ok -eq $true -and $response.version -eq '2.4') {
                  $installedHealthy = $true
                  break
                }
              } catch {
                $installed.Refresh()
                if ($installed.HasExited) {
                  throw "Installed HomeServer.exe exited before becoming healthy with code $($installed.ExitCode)"
                }
              }
            }
            if (-not $installedHealthy) { throw 'Installed HomeServer.exe did not launch successfully from the Inno Setup installation directory' }
          } finally {
            $installed.Refresh()
            if (-not $installed.HasExited) { & taskkill.exe /PID $installed.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Installed HomeServer launch smoke left a listener on port 4377'
          }
      - name: Verify distribution files
        shell: pwsh
        run: |
          $files = @('dist/HomeServer.exe', 'dist/HomeServerSetup.exe')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "$file was not built" }
          }
          $hashMap = [ordered]@{}
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            $name = [System.IO.Path]::GetFileName($file)
            $digest = $hash.Hash.ToLower()
            $hashMap[$name] = $digest
            "$digest  $name"
          }
          $lines | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          $manifest = [ordered]@{
            format = 'vp3-os-release-v1'
            version = '2.4'
            channel = 'stable'
            minimum_schema_version = 38
            files = $hashMap
            release_notes = 'HomeServer v2.4 federated continuity through Disconnect/Reconnect Reconciliation; includes Agent Brain & Memory, Files & Documents, retained v2.3 execution, governed actions, local voice and Profile Agent parity'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'dist/RELEASE.json'
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: HomeServer-Windows
          path: |
            dist/HomeServer.exe
            dist/HomeServerSetup.exe
            dist/SHA256SUMS.txt
            dist/RELEASE.json
          if-no-files-found: error
          retention-days: 14
