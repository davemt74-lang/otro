          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage managed FFmpeg runtime
        shell: pwsh
        run: ./scripts/stage_ffmpeg_windows.ps1
      - name: Verify managed FFmpeg runtime
        shell: pwsh
        run: |
          & 'dist/tools/ffmpeg/ffmpeg.exe' -version
          if ($LASTEXITCODE -ne 0) { throw 'Managed ffmpeg.exe failed' }
          & 'dist/tools/ffmpeg/ffprobe.exe' -version
          if ($LASTEXITCODE -ne 0) { throw 'Managed ffprobe.exe failed' }
          if (-not (Test-Path 'dist/tools/ffmpeg/manifest.json')) { throw 'Managed FFmpeg manifest missing' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not found' }
          & $compiler 'installer\HomeServer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Verify silent installer upgrade preserves private data
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/HomeServerSetup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'HomeServerInstalled'
          $privateDir = Join-Path $env:LOCALAPPDATA 'HomeServer\Data'
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $privateDir -ErrorAction SilentlyContinue
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir",'/TASKS=""')
          $first = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw "First silent install failed with $($first.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'HomeServer.exe'))) { throw 'Installed HomeServer.exe missing' }
          $installedFfmpeg = Join-Path $installDir 'tools\ffmpeg\ffmpeg.exe'
          $installedFfprobe = Join-Path $installDir 'tools\ffmpeg\ffprobe.exe'
          $installedManifest = Join-Path $installDir 'tools\ffmpeg\manifest.json'
          if (-not (Test-Path $installedFfmpeg) -or -not (Test-Path $installedFfprobe) -or -not (Test-Path $installedManifest)) {
            throw 'Managed FFmpeg runtime missing from installed HomeServer'
          }
          & $installedFfmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'Installed managed ffmpeg.exe failed health check' }
          & $installedFfprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'Installed managed ffprobe.exe failed health check' }
          New-Item -ItemType Directory -Force -Path $privateDir | Out-Null
          Set-Content -Encoding utf8 (Join-Path $privateDir 'upgrade-sentinel.txt') 'preserve-me'
          $second = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($second.ExitCode -ne 0) { throw "Upgrade install failed with $($second.ExitCode)" }
          if ((Get-Content (Join-Path $privateDir 'upgrade-sentinel.txt') -Raw).Trim() -ne 'preserve-me') {
            throw 'Installer upgrade modified private HomeServer data'
          }

          $installedExe = Join-Path $installDir 'HomeServer.exe'
          $browserReport = Join-Path $env:RUNNER_TEMP 'a5b4-installed-browser.json'
          $browserTest = Start-Process -FilePath $installedExe -ArgumentList @('--browser-self-test', $browserReport) -Wait -PassThru
          if ($browserTest.ExitCode -ne 0 -or -not (Test-Path $browserReport)) { throw 'Installed managed browser failed startup' }
          $certification = Get-Content $browserReport -Raw | ConvertFrom-Json
          if (-not $certification.ok -or -not $certification.managed_browser) { throw 'Installed browser not certified' }
          $env:HOMESERVER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'homeserver-installed-launch'
          Remove-Item -Recurse -Force $env:HOMESERVER_DATA_DIR -ErrorAction SilentlyContinue
          $installed = Start-Process -FilePath $installedExe -ArgumentList '--headless' -PassThru
          $installedHealthy = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4377/api/v1/health' -TimeoutSec 2
                if ($response.ok -eq $true -and $response.version -eq '2.4') {
                  $installedHealthy = $true
                  break
                }
              } catch {
                $installed.Refresh()
                if ($installed.HasExited) {
                  throw "Installed HomeServer.exe exited before becoming healthy with code $($installed.ExitCode)"
                }
              }
            }
            if (-not $installedHealthy) { throw 'Installed HomeServer.exe did not launch successfully from the Inno Setup installation directory' }
          } finally {
            $installed.Refresh()
            if (-not $installed.HasExited) { & taskkill.exe /PID $installed.Id /T /F | Out-Null }
            Get-Process -Name 'HomeServer' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
          if (Get-NetTCPConnection -LocalPort 4377 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Installed HomeServer launch smoke left a listener on port 4377'
          }
      - name: Verify distribution files
        shell: pwsh
        run: |
          $schema = (& python -c "from app.database import migration_files; print(max([1] + [version for version, _ in migration_files()]))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $schema -or [int]$schema -lt 75) {
            throw "HomeServer release manifest cannot verify its current migration version"
          }
          $files = @('dist/HomeServer.exe', 'dist/HomeServerSetup.exe')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "$file was not built" }
          }
          $hashMap = [ordered]@{}
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            $name = [System.IO.Path]::GetFileName($file)
            $digest = $hash.Hash.ToLower()
            $hashMap[$name] = $digest
            "$digest  $name"
          }
          $lines | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          $manifest = [ordered]@{
            format = 'vp3-os-release-v1'
            version = '2.4'
            channel = 'stable'
            minimum_schema_version = 38
            current_schema_version = [int]$schema
            feature_track = 'Tracky V2.81'
            feature_section = 3
            federated_automation_protocol = 'physical_federated_automation.v1'
            federated_automation_execution_enabled = $true
            physical_world_trigger_runtime = $true
            distributed_action_execution = $true
            golden_operational_scenarios = 24
            recovery_authority = 'section7_authoritative_reconciliation'
            owner_visual_identity_contract = 'tracky.visual.owner-contact-association.v1f6'
            owner_visual_identity_claim = 'owner_attributed_unverified'
            visual_cloud_transport = 'paired_scalar_revision_ack_no_biometrics'
            agent_eyes_section = '1G5'
            agent_eyes_acceptance_contract = 'tracky.agent-eyes.release-acceptance.v1g5'
            agent_eyes_experience_contract = 'tracky.agent-eyes.experience.v1g4'
            native_hardware_certified = $false
            source_commit = '${{ github.sha }}'
            browser_section = 'A5B4'
            managed_browser_runtime = 'tools/browser/manifest.json'
            packaged_browser_certified = $true
            files = $hashMap
            release_notes = 'A5B4 governed browser repair: atomic owner authority, retry receipts, exact GET form review, adaptive reads, per-worker Brain visibility and installer-managed Chromium. Consequential business actions remain separately restricted.'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'dist/RELEASE.json'
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: HomeServer-Windows
          path: |
            dist/HomeServer.exe
            dist/HomeServerSetup.exe
            dist/SHA256SUMS.txt
            dist/RELEASE.json
            dist/tools/browser/**
          if-no-files-found: error
          retention-days: 14
