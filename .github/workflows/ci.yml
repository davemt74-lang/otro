name: HomeServer CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app desktop tests
      - name: Validate browser JavaScript
        run: node --check ui/app.js
      - name: Smoke test API and SQLite
        run: python tests/smoke.py
      - name: Build executable
        run: pyinstaller HomeServer.spec --clean --noconfirm
      - name: Verify control center packaged
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/HomeServer.exe')) { throw 'HomeServer.exe was not built' }
