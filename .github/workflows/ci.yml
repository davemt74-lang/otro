name: HomeServer CI

on:
  pull_request:
    paths:
      - 'app/services/agent_browser_runtime.py'
      - 'app/services/agent_mission*.py'
      - 'app/agent_mission*.py'
      - 'database/migrations/07*_agent_mission*.sql'
      - 'ui/agent-browser-workspaces.js'
      - 'tests/*a5c*'
      - 'scripts/stage_browser_runtime.py'
      - 'installer/HomeServer.iss'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: homeserver-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  certified-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - id: find
        name: Find a certified PR build of the exact merged tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repository=os.environ['REPOSITORY']
          def api(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repository+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          current=api('/git/commits/'+os.environ['SOURCE_COMMIT'])
          parents={item['sha'] for item in current['parents']}
          runs=api('/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=100')['workflow_runs']
          for run in runs:
              if run['head_sha'] not in parents or run['head_repository']['full_name']!=repository:continue
              if api('/git/commits/'+run['head_sha'])['tree']['sha']!=current['tree']['sha']:continue
              artifacts=api('/actions/runs/'+str(run['id'])+'/artifacts')['artifacts']
              if not any(item['name']=='HomeServer-Windows' and not item['expired'] for item in artifacts):continue
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('run_id='+str(run['id'])+'\n')
              break
          PY
      - name: Download the certified Windows distribution
        if: steps.find.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: HomeServer-Windows
          path: certified
          github-token: ${{ github.token }}
          run-id: ${{ steps.find.outputs.run_id }}
      - id: verify
        name: Verify binaries, browser certification and source provenance
        if: steps.find.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          CERTIFIED_RUN: ${{ steps.find.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('certified');manifest=json.loads((root/'RELEASE.json').read_text(encoding='utf-8-sig'))
          def tree(commit):
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/commits/'+commit,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)['tree']['sha']
          current_tree=tree(os.environ['SOURCE_COMMIT'])
          assert tree(manifest['source_commit'])==current_tree,'Compiled tree differs from merged tree'
          assert manifest['packaged_browser_certified'] is True and manifest['browser_section']=='A5B4'
          for name in ('HomeServer.exe','HomeServerSetup.exe'):
              with (root/name).open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==manifest['files'][name],name+' hash mismatch'
          browser_root=root/'tools'/'browser'
          browser=json.loads((browser_root/'manifest.json').read_text())
          executable=(browser_root/browser['executable']).resolve()
          assert executable.is_relative_to(browser_root.resolve())
          with executable.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==browser['sha256']
          manifest['certified_build_commit']=manifest['source_commit']
          manifest['certified_build_run']=os.environ['CERTIFIED_RUN']
          manifest['source_commit']=os.environ['SOURCE_COMMIT']
          manifest['source_tree']=current_tree
          manifest['certification_reused_without_source_changes']=True
          (root/'RELEASE.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('reused=true\n')
          print('Exact merged tree and certified Windows/browser hashes verified')
          PY
      - name: Upload verified merged release
        if: steps.verify.outputs.reused == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HomeServer-Windows
          path: certified/**
          if-no-files-found: error
          retention-days: 30
