name: HomeServer PR Core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeserver-pr-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile core Python
        run: python -m compileall app tests
      - name: Interactive capture ownership and Stop acceptance
        run: |
          node tests/capture-ownership-section1.mjs
          node tests/listening-section2.mjs
          node tests/transcription-section3.mjs
          python tests/transcription_processing_section3.py
          node tests/transcription-section4.mjs
          node tests/participants-section5.mjs
          python tests/transfer_retention_section7.py
          python tests/interactive_agent_context_section8.py
          python tests/speaker_attribution_section9.py
          python tests/speaker_diarization_section9.py
          python tests/speaker_diarization_ui_section9.py
          node tests/speaker_fusion_section9.mjs
          node --experimental-vm-modules tests/speaker_fusion_lifecycle_section9.mjs
          python tests/speaker_fusion_ui_section9.py
          python tests/knowledge_backup_v032.py
          python tests/governed_recordings_v502.py
          python tests/local_transcription_sessions_v503.py
          python tests/meetings_reliability_section6.py
          python tests/meeting_transcription_v1860.py
          python tests/meeting_transcription_control_v1880.py
          python tests/transcription_integrity_section4.py
          node --check ui/brain.js
          node --check ui/chat-enhancements.js
          python tests/chat_dictation_ui_contract.py
          python tests/chat_enhancements_ui_contract.py
          node --check ui/transcription-workspace.js
      - name: First-run welcome contract and browser syntax
        run: |
          python tests/first_run_v2.py
          node --check ui/welcome.js
      - name: Agent-first cloud onboarding contract
        run: |
          python tests/chat_onboarding_v2.py
          node --check ui/chat-onboarding.js
          node --check ui/welcome.js
      - name: Integrated owner-only Tracky visual enrollment contracts
        run: |
          python tests/tracky_visual_onboarding.py
          node tests/tracky_visual_browser.mjs
          node tests/tracky_owner_self_check_v1f4.mjs
          node --check ui/tracky/owner-self-check.js
          python tests/tracky_visual_contact_link_v1f1.py
          python tests/tracky_visual_cloud_sync_v1f2.py
          node tests/tracky_visual_cloud_sync_ui_v1f2.mjs
          python tests/tracky_visual_delivery_truth_v1f4.py
          node tests/tracky_visual_delivery_truth_ui_v1f4.mjs
          python tests/tracky_visual_ordered_sender_v1f6.py
          node tests/tracky_visual_ordered_sender_ui_v1f6.mjs
          node tests/tracky_visual_contact_link_ui_v1f1.mjs
          node --check ui/tracky/owner-contact-link.js
          node --check ui/tracky/owner-visual.js
      - name: Owner-gated canonical Tracky camera-to-inference provider
        run: |
          python tests/tracky_integrated_provider_truth_v1g1.py
          node tests/tracky_integrated_provider_truth_ui_v1g1.mjs
          python tests/tracky_owner_perception_v1.py
          node tests/tracky_owner_perception_ui_v1.mjs
          node --check ui/tracky/eyes-runtime.js
      - name: Native owner-approved Tracky camera runtime
        run: |
          python tests/tracky_native_camera_v1.py
          node tests/tracky_native_camera_ui_v1.mjs
          node --check ui/tracky/native-camera.js
          python tests/tracky_native_live_diagnosis_v1c.py
          python tests/tracky_native_certification_v1d.py
          python tests/tracky_native_managed_session_v1e1.py
          python tests/tracky_agent_eyes_v1g2.py
          python tests/tracky_agent_eyes_budgets_v1g2b1.py
          python tests/tracky_agent_eyes_recovery_v1g2b2.py
          python tests/tracky_agent_eyes_acceptance_v1g2b3.py
          python tests/tracky_agent_eyes_context_v1g3a.py
          node tests/tracky_agent_eyes_context_ui_v1g3a.mjs
          python tests/tracky_agent_eyes_evidence_v1g3b.py
          python tests/tracky_agent_eyes_scene_v1g3c.py
          python tests/tracky_agent_eyes_shared_scene_v1g3d.py
          python tests/tracky_agent_eyes_experience_v1g4.py
          python tests/tracky_agent_eyes_release_acceptance_v1g5.py
          node tests/tracky_agent_eyes_release_acceptance_ui_v1g5.mjs
          node --check ui/tracky/agent-eyes-release-acceptance.js
          node tests/tracky_agent_eyes_shared_scene_ui_v1g3d.mjs
          node tests/tracky_agent_eyes_scene_ui_v1g3c.mjs
          node --check ui/tracky/agent-eyes-scene.js
          node tests/tracky_agent_eyes_evidence_ui_v1g3b.mjs
          python tests/tracky_agent_eyes_extended_v1g2b4.py
          node tests/tracky_agent_eyes_extended_ui_v1g2b4.mjs
          node tests/tracky_agent_eyes_acceptance_ui_v1g2b3.mjs
          node tests/tracky_agent_eyes_recovery_ui_v1g2b2.mjs
          node tests/tracky_agent_eyes_budgets_ui_v1g2b1.mjs
          node tests/tracky_agent_eyes_ui_v1g2.mjs
          node --check ui/tracky/agent-eyes.js
          python tests/tracky_native_session_safety_v1e2.py
          python tests/tracky_native_session_evidence_v1e3.py
          python tests/tracky_native_model_drift_v1e4.py
          python tests/tracky_native_live_approval_v1e5.py
          python tests/tracky_native_model_integrity_v1e5.py
          node tests/tracky_native_model_integrity_ui_v1e5.mjs
          node tests/tracky_native_live_approval_ui_v1e5.mjs
          node tests/tracky_native_model_drift_ui_v1e4.mjs
          node tests/tracky_native_session_evidence_ui_v1e3.mjs
          node tests/tracky_native_session_safety_ui_v1e2.mjs
          node tests/tracky_native_managed_ui_v1e1.mjs
          node tests/tracky_native_certification_ui_v1d.mjs
          node tests/tracky_native_live_diagnosis_ui_v1c.mjs
      - name: Verify migration chain and retained contacts acceptance
        run: |
          python tests/migrations.py
          python tests/contacts_continuity_v241.py
      - name: Validate retained v2.4 release baseline and current Windows launch contract
        run: |
          node tests/v24_historical_baseline_v1f8.mjs
          python tests/single_instance.py
      - name: Validate cumulative Tracky release migration and installer metadata
        run: |
          node tests/tracky_v24_release_baselines_v1f9.mjs
          python tests/tracky_contract_join_v273.py
          python tests/hosting_runtime_v100.py
      - name: Verify API smoke contract
        run: python tests/smoke.py
      - name: Verify tool security contract
        run: python tests/tools_security.py
      - name: Verify Agent tool contract
        run: python tests/agent_tools.py
      - name: Verify action approval contract
        run: python tests/action_approvals.py
