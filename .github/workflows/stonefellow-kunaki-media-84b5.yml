name: Stonefellow Kunaki Secure Media Worker 84B5

on:
  pull_request:
    paths:
      - 'app/services/stonefellow_kunaki_media.py'
      - 'tests/stonefellow_kunaki_media_84b5.py'
      - '.github/workflows/stonefellow-kunaki-media-84b5.yml'
  push:
    branches: [main]
    paths:
      - 'app/services/stonefellow_kunaki_media.py'
      - 'tests/stonefellow_kunaki_media_84b5.py'
      - '.github/workflows/stonefellow-kunaki-media-84b5.yml'

jobs:
  media-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker transport
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Compile secure worker and offline acceptance
        run: python -m py_compile app/services/stonefellow_kunaki_media.py tests/stonefellow_kunaki_media_84b5.py
      - name: Signed transfer, no vendor writes, and private-media integrity
        run: PYTHONPATH=. python tests/stonefellow_kunaki_media_84b5.py
