name: Temporary Local App Capability Patch

on:
  push:
    branches: [local-voice-runtime]
    paths:
      - .github/workflows/patch-local-app-capabilities-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local-voice-runtime
      - name: Apply reviewed capability metadata patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/services/local_apps.py')
          text = path.read_text(encoding='utf-8')
          old = '''        capabilities = _decode_json(row["capabilities_json"], [])
        result.append({
            "key": row["app_key"],
            "name": row["name"],
            "version": row["installed_version"],
            "status": row["status"],
            "capabilities": capabilities if isinstance(capabilities, list) else [],
            "local": True,
        })'''
          new = '''        stored_capabilities = _decode_json(row["capabilities_json"], [])
        # When the installed binary version still matches the reviewed catalog,
        # capability metadata may safely evolve with the HomeServer adapter
        # without forcing a large binary reinstall. A version-mismatched app
        # keeps its stored capabilities until it is explicitly updated.
        if row["installed_version"] == package["version"]:
            capabilities = list(package.get("capabilities") or [])
        else:
            capabilities = stored_capabilities if isinstance(stored_capabilities, list) else []
        result.append({
            "key": row["app_key"],
            "name": row["name"],
            "version": row["installed_version"],
            "status": row["status"],
            "capabilities": capabilities,
            "local": True,
        })'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one installed_capabilities block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/patch-local-app-capabilities-temp.yml').unlink()
      - name: Commit reviewed patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/local_apps.py .github/workflows/patch-local-app-capabilities-temp.yml
          git commit -m "Keep installed Local App capability metadata current"
          git push origin HEAD:local-voice-runtime
