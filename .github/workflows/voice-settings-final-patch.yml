name: Voice Settings Final Patch

on:
  push:
    branches:
      - voice-settings
    paths:
      - .github/workflows/voice-settings-final-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice-settings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded final patch
        run: python .github/voice_settings_final_patch.py
      - name: Commit final Voice Settings reliability fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Voice Settings startup and fallback behavior"
          git push origin HEAD:voice-settings
