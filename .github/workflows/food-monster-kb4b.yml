name: KB4B OTRO Verified Food Monster Revocation
on:
  pull_request:
    paths:
      - 'app/services/food_monster_connector.py'
      - 'tests/food_monster_kb3.py'
      - 'docs/FOOD_MONSTER_KB4B_REMOTE_REVOCATION.md'
      - 'docs/FOOD_MONSTER_KB3_CONNECTOR.md'
      - '.github/workflows/food-monster-kb4b.yml'
  push:
    branches: [main]
    paths:
      - 'app/services/food_monster_connector.py'
      - 'tests/food_monster_kb3.py'
      - 'docs/FOOD_MONSTER_KB4B_REMOTE_REVOCATION.md'
      - 'docs/FOOD_MONSTER_KB3_CONNECTOR.md'
      - '.github/workflows/food-monster-kb4b.yml'
jobs:
  verified-revocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HomeServer connector dependencies
        run: python -m pip install fastapi==0.115.6 pydantic==2.10.4 httpx==0.28.1
      - name: Validate origin, source-identity and disconnect contracts
        run: |
          python -m py_compile app/services/food_monster_connector.py tests/food_monster_kb3.py
          PYTHONPATH=. python tests/food_monster_kb3.py
          PYTHONPATH=. python tests/food_monster_kb4a.py
