name: VP3 OS Physical Meeting v0.40

on:
  pull_request:
  push:
    branches:
      - main
      - vp3-os-v040-physical-meeting-runtime

permissions:
  contents: read

jobs:
  physical-meeting:
    name: Physical meeting · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile VP3 OS v0.40 runtime
        run: >-
          python -m py_compile
          app/services/inference_cancellation.py
          app/services/providers.py
          app/services/brain.py
          app/services/context_chat.py
          app/services/approvals.py
          app/services/agent_workflow_tool.py
          app/services/device_audio.py
          app/services/physical_agent.py
          app/services/physical_meeting.py
          app/services/meeting_intelligence.py
          app/services/meeting_cards.py
          app/services/vp3_os.py
          app/main.py
          app/bridge.py
          app/vp3_os_api.py
          tests/inference_cancellation_v040.py
          tests/device_audio_v040.py
          tests/physical_meeting_v040.py
          tests/physical_meeting_ui_contract_v040.py
      - name: Validate Agent Chat Meeting Card JavaScript
        run: node --check ui/brain.js
      - name: Verify v0.20 hardware adapter compatibility
        run: python tests/vp3_os_v020.py
      - name: Verify v0.30 device audio compatibility
        run: python tests/device_audio_v030.py
      - name: Verify v0.30 Physical Agent compatibility
        run: python tests/vp3_os_v030.py
      - name: Verify v0.40 streaming device audio
        run: python tests/device_audio_v040.py
      - name: Verify v0.40 in-flight cancellation
        run: python tests/inference_cancellation_v040.py
      - name: Verify v0.40 Physical Meeting runtime
        run: python tests/physical_meeting_v040.py
      - name: Verify v0.40 Meeting Card UI contract
        run: python tests/physical_meeting_ui_contract_v040.py
