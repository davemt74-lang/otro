name: Agent Result Handoff v0.49

on:
  pull_request:
    paths:
      - 'app/bridge.py'
      - 'app/handoffs_api.py'
      - 'app/services/agent_handoffs.py'
      - 'app/services/agent_workflow_tool.py'
      - 'database/agent_delegation_workflows.sql'
      - 'ui/agent-workflows.js'
      - 'ui/agent-workflows.css'
      - 'tests/agent_handoffs_v049.py'
      - 'tests/agent_handoff_revocation_v049.py'
      - 'tests/agent_handoffs_ui_contract_v049.py'
      - 'tests/agent_workflows_v048.py'
      - 'tests/agent_routing_v047.py'
      - '.github/workflows/agent-handoffs-v049.yml'
  push:
    branches: [main]
    paths:
      - 'app/bridge.py'
      - 'app/handoffs_api.py'
      - 'app/services/agent_handoffs.py'
      - 'app/services/agent_workflow_tool.py'
      - 'database/agent_delegation_workflows.sql'
      - 'ui/agent-workflows.js'
      - 'ui/agent-workflows.css'
      - 'tests/agent_handoffs_v049.py'
      - 'tests/agent_handoff_revocation_v049.py'
      - 'tests/agent_handoffs_ui_contract_v049.py'
      - 'tests/agent_workflows_v048.py'
      - 'tests/agent_routing_v047.py'
      - '.github/workflows/agent-handoffs-v049.yml'

permissions:
  contents: read

jobs:
  agent-handoffs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Agent result handoff backend
        run: python -m compileall app/bridge.py app/handoffs_api.py app/services/agent_handoffs.py app/services/agent_workflow_tool.py tests/agent_handoffs_v049.py tests/agent_handoff_revocation_v049.py tests/agent_handoffs_ui_contract_v049.py
      - name: Validate Agent workflow JavaScript
        run: node --check ui/agent-workflows.js
      - name: Agent Result Handoff regression
        run: python tests/agent_handoffs_v049.py
      - name: Agent Result Handoff live-revocation regression
        run: python tests/agent_handoff_revocation_v049.py
      - name: Agent Result Handoff UI API package contract
        run: python tests/agent_handoffs_ui_contract_v049.py
      - name: Retain v0.48 Agent Delegation and Multi-Agent Workflows regression
        run: python tests/agent_workflows_v048.py
      - name: Retain v0.47 Agent Selection and Persona Routing regression
        run: python tests/agent_routing_v047.py
      - name: Retain canonical Agent context v4.30 contract
        run: python tests/canonical_agent_context_v430.py
      - name: Retain canonical Agent context runtime regression
        run: python tests/canonical_context_runtime_v430.py
