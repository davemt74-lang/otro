name: App Scope CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app-scopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile scoped capability runtime
        run: python -m compileall app/main.py app/cognition_api.py app/tools_api.py app/services/app_scopes.py app/services/context_chat.py app/services/context_engine.py app/services/delegation.py app/services/pairing.py tests/app_scopes_v026.py
      - name: Cross-wrapper capability scope regression
        run: python tests/app_scopes_v026.py
