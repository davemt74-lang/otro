name: Knowledge-backed Chat Actions R8
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: capture-r4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      VP3_KNOWLEDGE_R8_EXPORT: ${{ github.workspace }}/_certification/knowledge-actions-r8-export.json
      VP3_KNOWLEDGE_R7_EXPORT: ${{ github.workspace }}/_certification/project-knowledge-r7-export.json
      VP3_KNOWLEDGE_R6_EXPORT: ${{ github.workspace }}/_certification/project-knowledge-r6-export.json
      VP3_CAPTURE_R5_EXPORT: ${{ github.workspace }}/_certification/project-knowledge-r5-export.json
      VP3_CAPTURE_R5_RECEIPTS: ${{ github.workspace }}/_certification/project-knowledge-r5-receipts.json
      VP3_CAPTURE_R5_NATIVE_COMMAND: python tests/project_knowledge_r5.py
      VP3_CAPTURE_R4_EXPORT: ${{ github.workspace }}/_certification/capture-r4-export.json
      VP3_SECTION7_MYSQL_DSN: mysql:host=127.0.0.1;port=3306
      VP3_SECTION7_MYSQL_PASSWORD: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: davemt74-lang/software
          ref: da9d186da51b310baa702c6064cac03d9e754bae
          path: _certification/cloud
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native acceptance dependencies
        run: pip install -r requirements.txt
      - name: Canonical Cloud writes and production workspace export
        run: |
          php _certification/cloud/tests/project-knowledge-r5-mysql.php
          php _certification/cloud/tests/project-knowledge-r6-mysql.php
          php _certification/cloud/tests/project-knowledge-r7-mysql.php
          php _certification/cloud/tests/knowledge-actions-r8-mysql.php
      - name: Same captures and Knowledge in native Chat and Brain
        run: |
          python tests/browser_captures_r4.py
          python tests/project_knowledge_r5.py
          python tests/project_knowledge_r6.py
          python tests/project_knowledge_r7.py
          python tests/knowledge_actions_r8.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser acceptance runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Native mobile capture and fresh-authority acceptance
        run: |
          node tests/browser_captures_r4_ui.mjs
          node _certification/cloud/tests/project-knowledge-r5-ui.mjs
          node _certification/cloud/tests/project-knowledge-r6-ui.mjs
          node _certification/cloud/tests/project-knowledge-r7-ui.mjs
          node _certification/cloud/tests/knowledge-actions-r8-ui.mjs
