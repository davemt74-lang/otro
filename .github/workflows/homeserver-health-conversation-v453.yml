name: HomeServer Section 31C Governed Maintenance

on:
  pull_request:
    paths:
      - 'app/services/maintenance_conversation.py'
      - 'app/services/agent_tools.py'
      - 'app/services/tools.py'
      - 'app/health_api.py'
      - 'tests/health_conversation_v453.py'
      - '.github/workflows/homeserver-health-conversation-v453.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hs-health-conversation-v453-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conversation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile touched runtime
        run: >-
          python -m py_compile
          app/services/maintenance_conversation.py
          app/services/agent_tools.py
          app/services/tools.py
          app/health_api.py
          tests/health_conversation_v453.py
      - name: Verify Section 31C owner-only diagnosis and governed proposal lifecycle
        run: python tests/health_conversation_v453.py
      - name: Regression - canonical health and repair orchestration
        if: runner.os == 'Linux'
        run: python tests/homeserver_health_repair_v440.py
