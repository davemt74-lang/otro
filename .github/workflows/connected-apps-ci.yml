name: Connected Apps + VP3 Pairing CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  connected-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Connected Apps and VP3 pairing control plane
        run: python -m compileall app/connected_apps_api.py app/remote_bridge_api.py app/services/connected_apps.py app/services/connected_apps_pairing.py app/services/cloud_pairing.py tests/connected_apps_v029.py tests/vp3_account_pairing_v062.py
      - name: Validate pairing JavaScript
        run: node --check ui/connected-apps-v029.js && node --check ui/connected-apps-deny-v029.js && node --check ui/remote.js
      - name: Connected Apps and wrapper-control regression
        run: python tests/connected_apps_v029.py
      - name: VP3 account-issued HomeServer pairing regression
        run: python tests/vp3_account_pairing_v062.py
